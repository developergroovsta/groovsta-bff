name: groovsta-turn

services:
  coturn:
    image: coturn/coturn:latest
    container_name: groovsta-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=groovsta.local"
      - "--user=${TURN_USERNAME}:${TURN_PASSWORD}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--stale-nonce=600"
      - "--user-quota=12"
      - "--total-quota=100"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
