services:
  transcode-worker:
    build:
      context: .
    image: groovsta-transcode-worker:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GROOVSTA_API_URL: ${GROOVSTA_API_URL:-http://host.docker.internal:8080}
      GROOVSTA_TRANSCODE_CALLBACK_SECRET: ${GROOVSTA_TRANSCODE_CALLBACK_SECRET:-development-transcode-secret}
      GROOVSTA_S3_BUCKET: ${GROOVSTA_S3_BUCKET:-groovsta-test-bucket}
      GROOVSTA_S3_ENDPOINT: ${GROOVSTA_S3_ENDPOINT:-}
      GROOVSTA_S3_PATH_STYLE_ACCESS: ${GROOVSTA_S3_PATH_STYLE_ACCESS:-false}
      GROOVSTA_TRANSCODE_POLL_SECONDS: ${GROOVSTA_TRANSCODE_POLL_SECONDS:-5}
      GROOVSTA_TRANSCODE_TIMEOUT_SECONDS: ${GROOVSTA_TRANSCODE_TIMEOUT_SECONDS:-1800}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
